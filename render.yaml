# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: push this repository to GitHub/GitLab -> Render dashboard -> New -> Blueprint -> select the repo.
services:
  - type: web
    name: codemind-os
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                      # free = 512 MB RAM, ephemeral disk, sleeps after 15 min idle
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CODEMIND_HOSTED
        value: "true"
      - key: CODEMIND_ADMIN_EMAIL       # your administrator login - Render asks you for it when the blueprint is created
        sync: false
      - key: CODEMIND_ADMIN_PASSWORD    # random password generated by Render; read it in the dashboard (Environment tab)
        generateValue: true
      - key: CODEMIND_SIGNUP_MODE       # approval = new accounts wait for an admin; open | closed also possible
        value: approval
      - key: CODEMIND_MAX_REPOS_PER_USER
        value: "5"
      - key: CODEMIND_STORAGE_DIR
        value: /tmp/codemind        # with a paid persistent disk use e.g. /var/data/codemind (see docs/DEPLOY_RENDER.md)
      - key: CODEMIND_EMBEDDING_BACKEND
        value: hashing
      - key: CODEMIND_VECTOR_BACKEND
        value: sqlite
      - key: CODEMIND_MAX_FILES         # keep indexing inside the 512 MB free-tier memory budget
        value: "4000"
      - key: CODEMIND_MAX_FILE_BYTES
        value: "300000"
      - key: CODEMIND_MAX_CLONE_MB
        value: "150"
      - key: CODEMIND_WORKFLOW_TIMEOUT_S
        value: "120"
    # Paid plans only - keeps indexes and reports across restarts/deploys:
    # disk:
    #   name: codemind-data
    #   mountPath: /var/data
    #   sizeGB: 1
