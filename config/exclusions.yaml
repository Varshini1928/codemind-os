# Default exclusion rules for CodeMind OS indexing.
# Secret detection is best-effort and cannot guarantee that every credential is found.
excluded_dirs:
  - .git
  - .hg
  - .svn
  - node_modules
  - venv
  - .venv
  - env
  - __pycache__
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .tox
  - .nox
  - .eggs
  - build
  - dist
  - target
  - .idea
  - .vscode
  - site-packages
  - .next
  - .nuxt
  - .cache
  - coverage
  - htmlcov
  - vendor
  - .terraform
  - .gradle
excluded_file_globs:
  - "*.min.js"
  - "*.min.css"
  - "*.map"
  - "*.lock"
  - package-lock.json
  - yarn.lock
  - pnpm-lock.yaml
  - poetry.lock
  - "*.pyc"
  - "*.pyo"
  - "*.egg-info"
  - ".DS_Store"
binary_extensions:
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .bmp
  - .ico
  - .webp
  - .pdf
  - .zip
  - .tar
  - .gz
  - .tgz
  - .bz2
  - .xz
  - .7z
  - .rar
  - .jar
  - .war
  - .class
  - .exe
  - .dll
  - .so
  - .dylib
  - .o
  - .a
  - .bin
  - .dat
  - .db
  - .sqlite
  - .sqlite3
  - .parquet
  - .pkl
  - .pickle
  - .npy
  - .npz
  - .h5
  - .onnx
  - .pt
  - .pth
  - .safetensors
  - .woff
  - .woff2
  - .ttf
  - .otf
  - .eot
  - .mp3
  - .mp4
  - .mov
  - .avi
  - .wav
secret_filename_globs:
  - ".env"
  - ".env.*"
  - "*.pem"
  - "*.key"
  - "*.p12"
  - "*.pfx"
  - "*.jks"
  - "*.keystore"
  - "id_rsa*"
  - "id_dsa*"
  - "id_ecdsa*"
  - "id_ed25519*"
  - "credentials*"
  - "secrets.*"
  - ".netrc"
  - ".npmrc"
  - ".pypirc"
  - "*.kdbx"
  - "service-account*.json"
  - "terraform.tfstate*"
  - "*.tfvars"
secret_filename_allow:
  - ".env.example"
  - ".env.sample"
  - ".env.template"
  - "*.pub"
